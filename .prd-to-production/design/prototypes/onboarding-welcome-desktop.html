<!doctype html><html lang="en-GB" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentPlan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script>
const FACES = ["500 16px 'Plus Jakarta Sans'","600 16px 'Plus Jakarta Sans'","700 16px 'Plus Jakarta Sans'","800 16px 'Plus Jakarta Sans'","700 40px 'Bricolage Grotesque'","800 40px 'Bricolage Grotesque'"];
function frame(t) {
  document.querySelectorAll('.bub').forEach(el => {
    const L = t - Math.min((+el.dataset.i) * 40, 400);
    const v = el.querySelector('.v'), cell = el.closest('.chg'), fl = cell && cell.querySelector('.flash');
    let s = 1;
    if (L >= 0 && L < 760) s = 1 + (cell && cell.classList.contains("arow") ? 0.03 : 0.075) * Math.exp(-L / 230) * Math.sin(Math.PI * L / 260);
    if (cell) cell.style.transform = `scale(${s.toFixed(3)})`;
    if (fl) fl.style.opacity = L < 0 ? 0 : L < 180 ? (L / 180).toFixed(2) : L < 760 ? (1 - (L - 180) / 580).toFixed(2) : 0;
    el.querySelectorAll('.dotp').forEach((d, j) => {
      const u = (L - 80 - j * 50) / 600, ang = [-50, -75, -30][j] * Math.PI / 180, dist = [30, 36, 24][j];
      d.style.opacity = (u > 0 && u < 1) ? (1 - u).toFixed(2) : 0;
      d.style.transform = `translate(${(Math.cos(ang) * dist * u).toFixed(1)}px, ${(Math.sin(ang) * dist * u).toFixed(1)}px) scale(${(1 - 0.5 * Math.max(0, u)).toFixed(2)})`;
    });
    if (v && el.dataset.from) {
      const a = +el.dataset.from, b = +el.dataset.to;
      const k = L < 180 ? 0 : L >= 500 ? 1 : (L - 180) / 320;
      const p = Math.round(a + (b - a) * k), pn = Math.abs(p);
      v.textContent = '£' + Math.floor(pn / 100).toLocaleString('en-GB') + (pn % 100 ? '.' + String(pn % 100).padStart(2, '0') : '');
    }
  });
}
document.fonts.ready.then(async () => {
  await Promise.all(FACES.map(f => document.fonts.load(f)));
  await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  const ok = FACES.every(f => document.fonts.check(f));
  document.documentElement.dataset.fonts = ok ? 'loaded' : 'missing';
  const h = location.hash.match(/t=(\d+)/);
  if (h && !matchMedia('(prefers-reduced-motion: reduce)').matches) frame(+h[1]);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm');
  document.documentElement.dataset.ready = '1';
});
</script></head><body><header class="top"><div class="brand"><span class="mark"><svg class="i" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /> <path d="M8 14h.01" /> <path d="M12 14h.01" /> <path d="M16 14h.01" /> <path d="M8 18h.01" /> <path d="M12 18h.01" /> <path d="M16 18h.01" /> </svg></span>StudentPlan</div></header><main style="max-width:1200px;margin:24px auto 0;padding:0 32px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center"><div class="stage" style="aspect-ratio:4/3.3"><img src="../sketches/welcome.webp" alt="" aria-hidden="true"></div><div style="display:flex;flex-direction:column;gap:32px"><h1 class="title" style="font-size:60px;line-height:1.04;letter-spacing:-.045em">Know what you can spend today.</h1><div style="display:flex;gap:12px"><button class="btn primary" style="height:60px;padding:0 30px;font-size:17px">Set up my plan</button><button class="btn" style="height:60px;padding:0 30px;font-size:17px">Try a demo student</button></div></div></main></body></html>
